[project]
name = "undercover-claims-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.7,<3"]

[project.optional-dependencies]
llm = ["openai>=1.40,<3"]
postgres = ["langgraph-checkpoint-postgres>=2,<4", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E702"]
